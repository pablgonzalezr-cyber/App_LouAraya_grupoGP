spring.application.name=lou-araya-cotizaciones
server.address=127.0.0.1
server.port=8096
spring.datasource.url=jdbc:h2:file:./data/lou-cotizaciones;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
lou.cotizaciones.admin.usuario=${LOU_COT_ADMIN_USUARIO}
lou.cotizaciones.admin.clave=${LOU_COT_ADMIN_CLAVE}
springdoc.swagger-ui.persist-authorization=false
