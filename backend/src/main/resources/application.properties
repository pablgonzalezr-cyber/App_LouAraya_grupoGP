spring.application.name=lou-araya-backend
server.address=127.0.0.1
server.port=8095
spring.datasource.url=jdbc:h2:file:./data/lou-araya;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
lou.security.usuario=${LOU_ADMIN_USUARIO}
lou.security.clave=${LOU_ADMIN_CLAVE}
springdoc.swagger-ui.persist-authorization=false
